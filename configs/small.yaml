# Single-GPU training config (~350–400M params with MoE). For a sub-minute pipeline
# smoke test, use configs/smoke.yaml instead.
vocab_size: 32000
max_seq_len: 2048
d_model: 768
n_layers: 12
n_heads: 12
n_kv_heads: 4
head_dim: 64
rope_theta: 500000.0
ffn_multiplier: 3.5
moe_layers_every: 2
n_experts: 8
moe_top_k: 2
moe_aux_loss_coef: 0.01
dropout: 0.0
use_checkpointing: false
mask_document_boundaries: false

batch_size: 2
grad_accum_steps: 8
learning_rate: 0.0003
weight_decay: 0.1
betas: [0.9, 0.95]
max_grad_norm: 1.0
warmup_steps: 100
max_steps: 10000
min_lr_ratio: 0.1
log_every: 10
eval_every: 500
save_every: 500
seed: 1337

# Set these paths before real training.
token_bin: artifacts/data/train.bin
val_token_bin: artifacts/data/val.bin
checkpoint_dir: artifacts/checkpoints/base
